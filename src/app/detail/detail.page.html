<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button (click)="goBack()" text="Atrás"></ion-back-button>
    </ion-buttons>
    <ion-title>Detalle Digimon</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div *ngIf="isLoading" class="loading-container">
    <ion-spinner name="crescent" class="spinner-large"></ion-spinner>
  </div>

  <div *ngIf="!isLoading && digimon" class="detail-content">
    <ion-card class="digimon-card">
      <img [src]="getImageUrl(digimon)" [alt]="digimon.name" class="digimon-image" />

      <ion-card-header>
        <ion-card-title class="digimon-title">{{ digimon.name }}</ion-card-title>
        <ion-card-subtitle class="digimon-subtitle" *ngIf="digimon.levels">
          Nivel: {{ getLevel(digimon) }}
        </ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <div class="info-row">
          <span class="info-label">ID:</span>
          <span class="info-value">{{ digimon.id }}</span>
        </div>

        <div class="info-row" *ngIf="digimon.types?.length">
          <span class="info-label">Tipo:</span>
          <span class="info-value">{{ getType(digimon) }}</span>
        </div>

        <div class="info-row" *ngIf="digimon.attributes?.length">
          <span class="info-label">Atributo:</span>
          <span class="info-value">{{ getAttribute(digimon) }}</span>
        </div>
      </ion-card-content>
    </ion-card>

    <ion-button expand="block" class="back-button" (click)="goBack()">
      Volver al listado
    </ion-button>
  </div>

  <div *ngIf="!isLoading && !digimon" class="error-container">
    <ion-icon name="alert-circle-outline" class="error-icon"></ion-icon>
    <p>No se pudo cargar el Digimon</p>
    <ion-button (click)="goBack()">Volver</ion-button>
  </div>
</ion-content>
